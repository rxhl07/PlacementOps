version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: placementops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: placement_admin
      POSTGRES_PASSWORD: placement_password_dev
      POSTGRES_DB: placementops_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U placement_admin -d placementops_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: placementops_redis
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
